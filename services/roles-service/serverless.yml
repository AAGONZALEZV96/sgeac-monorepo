service: roles-service

provider:
  name: aws
  runtime: python3.11
  stage: ${opt:stage, 'local'}
  region: us-east-1

  # Configuración de CORS global, correctamente indentada
  http:
    cors:
      origin: 'http://localhost:3000'
      headers:
        - Content-Type
        - Authorization
      allowCredentials: true

  environment:
    DYNAMODB_TABLE: ${self:custom.tableName}
    
  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
            - "dynamodb:PutItem"
            - "dynamodb:GetItem"
            - "dynamodb:UpdateItem"
            - "dynamodb:DeleteItem"
            - "dynamodb:Scan"
          Resource: "arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.tableName}"

plugins:
  - serverless-python-requirements
  - serverless-localstack
  - serverless-offline

custom:
  tableName: sgeac-roles-table-${self:provider.stage}
  pythonRequirements:
    dockerizePip: true
  localstack:
    stages:
      - local
  serverless-offline:
    httpPort: 3003 # Puerto para este servicio
    host: '0.0.0.0'
    lambdaPort: 4003 # Puerto para las funciones Lambda
    noPrependStageInUrl: true

functions:
  # --- ESTRUCTURA DE EVENTOS CORREGIDA Y LEGIBLE ---
  createRol:
    handler: create_rol.handler
    description: "Crea un nuevo rol."
    events:
      - http:
          path: /roles
          method: post

  listRoles:
    handler: list_rol.handler
    description: "Lista todos los roles."
    events:
      - http:
          path: /roles
          method: get

  getRolById:
    handler: get_rol.handler
    description: "Obtiene un rol por su ID."
    events:
      - http:
          path: /roles/{id}
          method: get

  updateRol:
    handler: up_rol.handler
    description: "Actualiza el nombre de un rol."
    events:
      - http:
          path: /roles/{id}
          method: put

  deleteRol:
    handler: delete_rol.handler
    description: "Elimina un rol."
    events:
      - http:
          path: /roles/{id}
          method: delete

resources:
  Resources:
    RolesTable:
      Type: 'AWS::DynamoDB::Table'
      Properties:
        TableName: ${self:custom.tableName}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1