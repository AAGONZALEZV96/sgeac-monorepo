service: user-service

provider:
  name: aws
  runtime: python3.11
  stage: ${opt:stage, 'local'}
  region: us-east-1

  # --- BLOQUE CORREGIDO ---
  # La configuración 'http' para el CORS global va DENTRO de provider.
  http:
    cors:
      origin: 'http://localhost:3000'
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Amz-Date
        - X-Api-Key
        - X-Amz-Security-Token
      allowCredentials: true
  
  environment:
    DYNAMODB_TABLE: ${self:custom.tableName}
    EMAIL_INDEX: ${self:custom.emailIndexName}
    JWT_SECRET: "UNA_CLAVE_MUY_SECRETA_PARA_DESARROLLO_12345"
    
  # La sección 'iam' también va DENTRO de provider.
  iam:
    role:
      statements:
        - Effect: "Allow"
          Action: [ "dynamodb:PutItem", "dynamodb:GetItem", "dynamodb:Scan", "dynamodb:UpdateItem", "dynamodb:DeleteItem", "dynamodb:Query" ]
          Resource: 
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.tableName}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.tableName}/index/*"
        - Effect: "Allow" 
          Action: [ "dynamodb:GetItem", "dynamodb:UpdateItem" ]
          Resource: "arn:aws:dynamodb:${self:provider.region}:*:table/sgeac-niveles-table-${self:provider.stage}"

plugins:
  - serverless-python-requirements
  - serverless-localstack
  - serverless-offline

custom:
  tableName: sgeac-users-table-${self:provider.stage}
  emailIndexName: email-index
  pythonRequirements:
    dockerizePip: true
  localstack:
    stages:
      - local
  serverless-offline:
    httpPort: 3001
    noPrependStageInUrl: true

functions:
  # --- SECCIÓN DE FUNCIONES MUCHO MÁS LIMPIA ---
  # Ya no necesitan el bloque 'cors' porque lo heredan del provider.
  
  createUser:
    handler: create_user.handler
    description: "Crea un nuevo usuario en la academia."
    events:
      - http:
          path: /users
          method: post

  getUserById:
    handler: get_user.handler
    description: "Obtiene un usuario por su ID único."
    events:
      - http:
          path: /users/{id}
          method: get

  listUsers:
    handler: list_user.handler
    description: "Lista todos los usuarios de la academia."
    events:
      - http:
          path: /users
          method: get

  updateUser:
    handler: update_user.handler
    description: "Actualiza los datos de un usuario existente."
    events:
      - http:
          path: /users/{id}
          method: put

  deleteUser:
    handler: delete_user.handler
    description: "Elimina un usuario por su ID."
    events:
      - http:
          path: /users/{id}
          method: delete
          
  asignarNivel:
    handler: asignar_nivel.handler
    description: "Asigna un alumno a un nuevo nivel, validando cupos."
    events:
      - http:
          path: /users/{id}/nivel
          method: post
          
  login:
    handler: login.handler
    description: "Inicia sesión de un usuario y devuelve un JWT."
    events:
      - http:
          path: /login
          method: post
          

resources:
  Resources:
    UsersTable:
      Type: 'AWS::DynamoDB::Table'
      Properties:
        TableName: ${self:custom.tableName}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        
        GlobalSecondaryIndexes:
          - IndexName: ${self:custom.emailIndexName}
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL
            ProvisionedThroughput:
              ReadCapacityUnits: 1
              WriteCapacityUnits: 1
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1