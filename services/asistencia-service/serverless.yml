service: asistencia-service

provider:
  name: aws
  runtime: python3.11
  stage: ${opt:stage, 'local'}
  region: us-east-1

  # Configuración de CORS global para toda la API de este servicio
  http:
    cors:
      origin: 'http://localhost:3000'
      headers:
        - Content-Type
        - Authorization
      allowCredentials: true

  environment:
    DYNAMODB_TABLE: ${self:custom.tableName}
    ALUMNO_INDEX: ${self:custom.alumnoIndexName}
    NIVEL_INDEX: ${self:custom.nivelIndexName}
    
  iam:
    role:
      statements:
        - Effect: "Allow"
          Action:
            - "dynamodb:PutItem"
            - "dynamodb:GetItem" # Añadido para completitud
            - "dynamodb:Query"
            - "dynamodb:UpdateItem"
            - "dynamodb:DeleteItem"
            - "dynamodb:Scan"
          Resource:
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.tableName}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:custom.tableName}/index/*"

plugins:
  - serverless-python-requirements
  - serverless-localstack
  - serverless-offline  # <-- Plugin añadido

custom:
  tableName: sgeac-asistencias-table-${self:provider.stage}
  alumnoIndexName: alumno-id-index
  nivelIndexName: nivel-id-index
  pythonRequirements:
    dockerizePip: true
  localstack:
    stages:
      - local
  serverless-offline:
    httpPort: 3004 # Puerto para el servicio de asistencia
    host: '0.0.0.0'
    lambdaPort: 4004 # Puerto para las funciones Lambda
    noPrependStageInUrl: true

functions:
  registrarAsistencia:
    handler: registrar_asistencia.handler
    description: "Registra la asistencia de un alumno."
    events:
      - http:
          path: /asistencia
          method: post
          # ya no se necesita cors: true aquí

  resumenPorAlumno:
    handler: resumen_x_alumno.handler
    description: "Devuelve el resumen de asistencias de un alumno."
    events:
      - http:
          path: /asistencia/resumen/alumno/{alumno_id}
          method: get

  resumenPorNivel:
    handler: resumen_x_nivel.handler
    description: "Devuelve el resumen de asistencias de un nivel."
    events:
      - http:
          path: /asistencia/resumen/nivel/{nivel_id}
          method: get

  listarAsistenciasPorAlumno:
    handler: list_by_alumno.handler
    description: "Devuelve el historial detallado de asistencias de un alumno."
    events:
      - http:
          path: /asistencia/alumno/{alumno_id}
          method: get

resources:
  # Tu sección de resources estaba perfecta y se mantiene igual
  Resources:
    AsistenciasTable:
      Type: 'AWS::DynamoDB::Table'
      Properties:
        TableName: ${self:custom.tableName}
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: alumno_id
            AttributeType: S
          - AttributeName: nivel_id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: ${self:custom.alumnoIndexName}
            KeySchema:
              - AttributeName: alumno_id
                KeyType: HASH
            Projection: { ProjectionType: ALL }
            ProvisionedThroughput: { ReadCapacityUnits: 1, WriteCapacityUnits: 1 }
          - IndexName: ${self:custom.nivelIndexName}
            KeySchema:
              - AttributeName: nivel_id
                KeyType: HASH
            Projection: { ProjectionType: ALL }
            ProvisionedThroughput: { ReadCapacityUnits: 1, WriteCapacityUnits: 1 }
        ProvisionedThroughput:
          ReadCapacityUnits: 1
          WriteCapacityUnits: 1